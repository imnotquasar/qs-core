# Network (filled in by txAdmin)
# ------------------------------

{{serverEndpoints}}

# Server info
# -----------

sv_licenseKey "{{svLicense}}"
sv_hostname "{{serverName}} | qs-core"
sets sv_projectName "{{serverName}} | [{{recipeName}}]"
sets sv_projectDesc "{{recipeDescription}}"
sets tags "qs-core, qscore, roleplay, framework, esx, qbcore"
sets locale "root-AQ"
sv_maxclients {{maxClients}}

# Same game build as the txAdmin default recipe
sv_enforceGameBuild 3751

# qs-corechat replaces the default chat resource
set resources_useSystemChat false

# Database (filled in by txAdmin)
# -------------------------------

set mysql_connection_string "{{dbConnectionString}}"

# Language for every qs-core resource: en | es | fr | de | it | pt | pl | ru | tr | ar
# ------------------------------------------------------------------------------------

set qs:locale "en"

# Administrators
# --------------
# txAdmin adds you to group.admin below. Everyone in group.admin can use the
# qs-core admin commands (/car, /revive, /adminkeys...) and the admin menu (F6).
# To add more admins: add_principal identifier.fivem:<id> group.admin

add_principal group.admin group.user
add_ace group.admin command allow
add_ace group.admin command.quit deny
{{addPrincipalsMaster}}

# qs-core manages groups/permissions at runtime via add_ace / add_principal
add_ace resource.qs-core command.qs allow
add_ace resource.qs-core command.add_ace allow
add_ace resource.qs-core command.remove_ace allow
add_ace resource.qs-core command.add_principal allow
add_ace resource.qs-core command.remove_principal allow

# pma-voice
# ---------

setr voice_enableRadioAnim 1
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly true

# Security convars
# ----------------

sv_enableNetworkedSounds false
sv_enableNetworkedScriptEntityStates false
sv_enableNetworkedPhoneExplosions false
sv_filterRequestControl 2

# Default & standalone resources
# ------------------------------

ensure mapmanager
ensure spawnmanager
ensure oxmysql
ensure ox_lib
ensure pma-voice

# qs-core: [core]
# ---------------

ensure qs-core
ensure qs-coreinventory
ensure qs-clothing
ensure qs-coreweapons
ensure qs-needs
ensure qs-coreshops
ensure qs-corehud
ensure qs-corechat
ensure qs-corevehiclekeys

# qs-core: [addons]
# -----------------
# Jobs and systems. Comment out the ones you do not want.

ensure qs-jobs
ensure qs-ambulance
ensure qs-police
ensure qs-coredrugs
ensure qs-vehicleshop
ensure qs-garage
ensure qs-admin
ensure qs-banking
ensure qs-rp

# Player boot flow: loading screen -> intro -> character selection
# ----------------------------------------------------------------

ensure loadingscreen
ensure qs-intro
ensure qs-coremulticharacter

# Maps & IPL loaders
# ------------------

ensure [maps]

# ESX / QBCore compatibility
# --------------------------
# Lets ESX and QBCore scripts run on qs-core without changes. Do NOT install the
# real es_extended or qb-core next to these. Put third-party scripts after this line.

ensure [bridge]
